x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-exoplanet}:${POSTGRES_PASSWORD:-exoplanet}@db:5432/${POSTGRES_DB:-exoplanet}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exoplanet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exoplanet}
      POSTGRES_DB: ${POSTGRES_DB:-exoplanet}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 5

  # One-shot job: docker compose run --rm ingest
  ingest:
    <<: *app
    command: ["python", "-m", "exoplanet_archive.ingest"]
    profiles: ["ingest"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
